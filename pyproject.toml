[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nri-scenario-manager"
version = "0.13.0"
description = "Desktop application for managing tabletop RPG scenarios"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "qasync>=0.27",
    "aiosqlite>=0.20",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

# Legacy baseline (narrow down gradually): logging.basicConfig() must run
# before the first PySide6/app import, so module-level imports cannot be
# moved to the top of app/main.py without changing startup side effects.
[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
