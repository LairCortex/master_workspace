name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed for creating releases

jobs:
  # ── Run tests first ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
          pip install -e ".[dev]"

      # Run 1 — line-coverage gate: fail_under comes from [tool.coverage.report]
      # in pyproject.toml (95 in PR1, 100 in PR2).
      - name: Run tests (line coverage gate)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing

      # Run 2 — branch coverage visibility: the CLI flag --cov-fail-under=0
      # overrides the config, so partial branches never fail the build.
      - name: Run tests (branch coverage, report only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ --cov=app --cov-branch --cov-fail-under=0 --cov-report=term

  # ── Lint (ruff, errors only: E + F) ─────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ tests/

  # ── Resolve app version + guard tag vs pyproject match ───────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: ver
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "App version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Guard: release tag must match pyproject version"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${{ steps.ver.outputs.version }}"
            exit 1
          fi

  # ── Build on 3 platforms ─────────────────────────────────────────────────
  build:
    needs: [test, lint, version]
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: nri-macos-${{ needs.version.outputs.version }}
            asset_name: nri-scenario-manager-macos-${{ needs.version.outputs.version }}.zip
          - os: windows-latest
            artifact_name: nri-windows-${{ needs.version.outputs.version }}
            asset_name: nri-scenario-manager-windows-${{ needs.version.outputs.version }}.zip
          - os: ubuntu-latest
            artifact_name: nri-linux-${{ needs.version.outputs.version }}
            asset_name: nri-scenario-manager-linux-${{ needs.version.outputs.version }}.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Linux: install system libs required by PySide6
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: pip install -e ".[build]"

      - name: Build application
        run: python build_app.py --clean

      - name: Sign macOS app bundle
        if: runner.os == 'macOS'
        run: |
          APP="dist/НРИ Сценарий Менеджер.app"
          if [ -d "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "Ad-hoc signed: $APP"
          fi

      # ── Package artifacts ──
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: dist
        run: zip -r9 ../${{ matrix.asset_name }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset_name }} -C dist .

      # ── Upload build artifact (always) ──
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 14

  # ── Create GitHub Release on tag push ────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, version]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/nri-macos-${{ needs.version.outputs.version }}/*
            artifacts/nri-windows-${{ needs.version.outputs.version }}/*
            artifacts/nri-linux-${{ needs.version.outputs.version }}/*
